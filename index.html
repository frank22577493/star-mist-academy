<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14233c"><title>星霧魔法學院｜可玩版</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a30;font-family:system-ui,"Noto Sans TC",sans-serif;color:white;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}button{font:inherit;color:white;cursor:pointer;touch-action:none}#top{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));background:#12223dcc;border:1px solid #ffffff35;border-radius:15px;padding:10px 14px;font-size:13px;max-width:58%;backdrop-filter:blur(8px)}#top strong{font-size:16px;color:#f9d9a4}#map{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:150px;height:150px;border-radius:18px;border:2px solid #e8d3a0;background:#182c3ce0;box-shadow:0 5px 20px #0008}#controls{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:16px;display:grid;grid-template-columns:repeat(3,57px);grid-template-rows:repeat(2,57px);gap:6px;pointer-events:auto}#controls button,.action{background:#1c385ecf;border:1px solid #a8c3e0aa;border-radius:16px;font-size:23px;box-shadow:0 4px 12px #0006}#controls button:active,.action:active{background:#5078aa}#right{position:absolute;right:15px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;pointer-events:auto}.action{font-size:15px;padding:12px 15px;min-width:95px}#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:155px;width:min(90vw,480px);background:#172742eb;border:1px solid #e2cc9b;border-radius:17px;padding:14px 18px;text-align:center;line-height:1.55;font-size:15px;display:none;pointer-events:auto}#msg button{background:#d8bd81;color:#192239;border:0;border-radius:10px;padding:6px 18px;margin-top:9px}#help{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:#142a45b8;border-radius:20px;padding:7px 12px;font-size:12px;white-space:nowrap}#title{position:absolute;inset:0;background:linear-gradient(140deg,#16283aeF,#364b6ceF);display:grid;place-content:center;text-align:center;gap:18px;pointer-events:auto;padding:20px}#title h1{font-size:clamp(29px,6vw,55px);margin:0;color:#f5dda6}#title p{max-width:430px;line-height:1.8}#title button{border:1px solid #fff8;background:#c6a568;color:#172640;border-radius:15px;padding:15px 28px;font-weight:bold;font-size:18px}#foot{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:10px;opacity:.6;white-space:nowrap}@media(max-width:620px){#map{width:117px;height:117px}#top{font-size:11px;max-width:55%}#top strong{font-size:13px}#help{top:auto;bottom:140px;font-size:10px}#controls{grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,49px)}#msg{bottom:128px}}
</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><strong>✦ 星霧魔法學院</strong><div id="status">月台 · 等待登車</div><div id="money">🪙 1000 銀幣</div></div><canvas id="map" width="150" height="150"></canvas><div id="help">方向鍵移動 · 拖動畫面轉視角 · 靠近目標按互動</div><div id="controls"><span></span><button data-dir="forward">▲</button><span></span><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div><div id="right"><button class="action" id="interact">✨ 互動</button><button class="action" id="rotate">↻ 視角</button><button class="action" id="full">⛶ 全螢幕</button><button class="action" id="reset">重玩</button></div><div id="msg"><div id="msgText"></div><button id="close">繼續</button></div><div id="title"><h1>✦ 星霧魔法學院 ✦</h1><p>穿越月台，登上魔法列車，和同學一起抵達星霧學院。<br>這是可以走動、互動、存檔的小型冒險版本。</p><button id="start">開始冒險</button><small>進度會自動儲存在這個瀏覽器</small></div><div id="foot">星霧魔法學院 · 遊戲測試版</div></div><script>
(()=>{'use strict';
const C=document.getElementById('game'),g=C.getContext('2d'),M=document.getElementById('map'),mg=M.getContext('2d');let W=0,H=0,DPR=1;const KEY='starMistSave2026v1';let state={scene:'platform',x:0,z:8,yaw:0,departed:false,lesson:false,money:1000};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&['platform','train','academy'].includes(s.scene))state={...state,...s}}catch{}let playing=false,keys={},dialog=false,last=0,cloud=0;
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
function resize(){let w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);if(w!==W||h!==H||d!==DPR){W=w;H=h;DPR=d;C.width=Math.round(w*d);C.height=Math.round(h*d);g.setTransform(d,0,0,d,0,0)}}
function say(t){$('msgText').textContent=t;$('msg').style.display='block';dialog=true}
function scene(s){state.scene=s;state.x=0;state.z=s==='academy'?17:s==='train'?10:8;save();update();say(s==='train'?'🚂 你成功登上星霧列車！請走到座位旁按「互動」，火車才會出發。':s==='academy'?'🏰 歡迎來到星霧魔法學院！沿著石板路走向城堡，參加第一堂魔法課。':'✨ 歡迎來到魔法月台！')}
function update(){$('status').textContent=state.scene==='platform'?'魔法月台 · 前往右側列車':state.scene==='train'?(state.departed?'列車行駛中 · 前往前方出口':'列車車廂 · 請先入座'):(state.lesson?'星霧學院 · 自由探索':'星霧學院 · 前往城堡');$('money').textContent='🪙 '+state.money+' 銀幣'}
function interact(){if(dialog){$('msg').style.display='none';dialog=false;return}let {scene:s,x,z}=state;
if(s==='platform'){if(x>3.2&&z>-1&&z<13)scene('train');else say('🚂 列車在月台右側。請往右走到車門附近，再按互動。')}
else if(s==='train'){if(!state.departed){if(Math.abs(x)>1.2){state.departed=true;save();update();say('🚂 你坐下了！汽笛響起，魔法列車開始行駛。點心推車員開始沿著走道巡迴。往車廂前方走就能抵達學院。')}else say('💺 請走到車廂左右兩側的座位旁，再按互動。')}else if(z<-5){scene('academy')}else if(Math.abs(x)<1.8&&z>0&&z<9){say('🍬 點心推車員：你好！今天有星星餅乾、南瓜派和巧克力蛙。這一版可以看菜單，暫時不扣錢。')}else say('🚂 火車正在穿過魔法山谷。往前走到車廂盡頭，按互動就會抵達學院。')}
else if(s==='academy'){if(z<-10&&Math.abs(x)<8){state.lesson=true;save();update();say('🪄 第一堂魔法課開始！老師教你點亮魔杖：「星光閃耀！」你已完成入學第一課，現在可以自由探索。')}else say('👋 同學：歡迎來到星霧學院！前方城堡就是教室。')}}
$('interact').onclick=interact;$('close').onclick=()=>{$('msg').style.display='none';dialog=false};$('start').onclick=()=>{$('title').style.display='none';playing=true;update();say(state.scene==='platform'?'✨ 你的入學旅程開始了！往右走到火車車門，按互動登車。':'✨ 已載入上次進度，歡迎回來！')};$('reset').onclick=()=>{if(confirm('確定刪除進度並重新開始嗎？')){localStorage.removeItem(KEY);state={scene:'platform',x:0,z:8,yaw:0,departed:false,lesson:false,money:1000};location.reload()}};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>say('請用 Safari 的「加入主畫面」開啟，或將 iPad 橫向以獲得更大畫面。'))}else document.exitFullscreen?.()};$('rotate').onclick=()=>state.yaw+=Math.PI/4;
document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>keys[k]=false)});
addEventListener('keydown',e=>{let m={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',w:'forward',s:'back',a:'left',d:'right'};if(m[e.key]){keys[m[e.key]]=true;e.preventDefault()}if(e.key===' '||e.key==='Enter')interact()});addEventListener('keyup',e=>{let m={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',w:'forward',s:'back',a:'left',d:'right'};if(m[e.key])keys[m[e.key]]=false});
let drag=null;C.addEventListener('pointerdown',e=>drag={x:e.clientX,y:e.clientY});C.addEventListener('pointermove',e=>{if(drag){state.yaw+=(e.clientX-drag.x)*.008;drag.x=e.clientX;drag.y=e.clientY}});C.addEventListener('pointerup',()=>drag=null);
const objects=[];function add(x,z,w,h,d,color,kind='box'){objects.push({x,z,w,h,d,color,kind})}function makeWorld(){objects.length=0;if(state.scene==='platform'){for(let i=-6;i<=6;i++){add(i*4,-11,1,6,1,'#f4e0c0','pillar');add(i*4,16,1,6,1,'#e9d9ba','pillar')}add(8,2,4,4,24,'#315e7c','train');for(let i=-4;i<=4;i++)add(-8,i*5,2,2,2,'#538273','tree');add(-1,-8,5,4,2,'#9a6e5e','arch')}else if(state.scene==='train'){for(let i=-4;i<=4;i++){add(-2.65,i*3,1.45,1.35,1.5,'#8d4c65','seat');add(2.65,i*3,1.45,1.35,1.5,'#8d4c65','seat')}for(let i=-5;i<=5;i++){add(-4.5,i*3,0.3,3.3,.2,'#f5e2b5');add(4.5,i*3,.3,3.3,.2,'#f5e2b5')}add(0,-14,8,3,.6,'#4b7394','door')}else{add(0,-20,15,10,9,'#8193b0','castle');for(let i=-2;i<=2;i++)add(i*5,-21,3,15,3,'#9eacc2','tower');for(let i=0;i<13;i++){let z=i*4-15;add(-11-(i%3)*3,z,1.5,4,1.5,'#4e8c70','tree');add(11+(i%3)*3,z,1.5,4,1.5,'#4e8c70','tree')}add(0,-11,4,1,.5,'#e7c98e','door')}}
function project(x,y,z){let dx=x-state.x,dz=z-state.z,co=Math.cos(state.yaw),si=Math.sin(state.yaw);let a=dx*co-dz*si,b=dx*si+dz*co;let depth=24-b;let scale=Math.min(W,H)*.83/(depth+8);return {x:W/2+a*scale,y:H*.59-(y-1.7)*scale+6*scale,b:depth,scale}}
function poly(points,color){let ps=points.map(p=>project(...p));if(ps.some(p=>p.b<-7))return;g.fillStyle=color;g.beginPath();g.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)g.lineTo(ps[i].x,ps[i].y);g.closePath();g.fill();g.strokeStyle='#16223922';g.lineWidth=1;g.stroke()}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),gg=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return `rgb(${r},${gg},${b})`}
function box(o){let {x,z,w,h,d,color}=o,x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2;poly([[x0,0,z0],[x1,0,z0],[x1,h,z0],[x0,h,z0]],shade(color,-18));poly([[x1,0,z0],[x1,0,z1],[x1,h,z1],[x1,h,z0]],shade(color,-35));poly([[x0,0,z1],[x1,0,z1],[x1,h,z1],[x0,h,z1]],color);poly([[x0,h,z0],[x1,h,z0],[x1,h,z1],[x0,h,z1]],shade(color,25));poly([[x0,0,z0],[x0,0,z1],[x0,h,z1],[x0,h,z0]],shade(color,-9));if(o.kind==='castle'){for(let i=-2;i<=2;i++)box({x:x+i*2.6,z:z+d/2+.05,w:1.1,h:2.4,d:.15,color:'#e8c780'})}if(o.kind==='train'){for(let i=-4;i<=4;i++)box({x:x-w/2-.06,z:z+i*2.4,w:.1,h:1.4,d:1.35,color:'#d6e8e6'})}if(o.kind==='tree'){let p=project(x,h+1,z);g.fillStyle='#417d65';g.beginPath();g.arc(p.x,p.y,Math.max(3,p.scale*1.5),0,7);g.fill()}}
function character(x,z,coat='#544a8a'){let p=project(x,0,z),s=p.scale;if(p.b<-5)return;g.fillStyle='#273c50aa';g.beginPath();g.ellipse(p.x,p.y,Math.max(3,s*.6),Math.max(2,s*.18),0,0,7);g.fill();g.fillStyle=coat;g.beginPath();g.moveTo(p.x-s*.48,p.y-s*2.3);g.lineTo(p.x+s*.48,p.y-s*2.3);g.lineTo(p.x+s*.7,p.y-s*.45);g.lineTo(p.x-s*.7,p.y-s*.45);g.fill();g.fillStyle='#f2cba8';g.beginPath();g.arc(p.x,p.y-s*2.75,s*.46,0,7);g.fill();g.fillStyle='#3b2c38';g.beginPath();g.arc(p.x,p.y-s*2.96,s*.49,Math.PI,Math.PI*2);g.fill();g.fillStyle='#efdc9d';g.fillRect(p.x+s*.45,p.y-s*2.1,s*.11,s*1.4)}
function drawMap(){let w=M.width,h=M.height;mg.clearRect(0,0,w,h);mg.fillStyle='#1d3347';mg.fillRect(0,0,w,h);mg.strokeStyle='#4f7486';mg.lineWidth=2;for(let i=0;i<6;i++){mg.beginPath();mg.moveTo(i*30,0);mg.lineTo(i*30,h);mg.moveTo(0,i*30);mg.lineTo(w,i*30);mg.stroke()}let sc=2.2,cx=w/2,cy=h/2;const mark=(x,z,color,r=5)=>{mg.fillStyle=color;mg.beginPath();mg.arc(cx+(x-state.x)*sc,cy+(z-state.z)*sc,r,0,7);mg.fill()};if(state.scene==='platform'){mg.fillStyle='#7890a0';mg.fillRect(cx+(6-state.x)*sc,cy+(-10-state.z)*sc,9*sc,25*sc);mark(6,3,'#f2c984',7)}if(state.scene==='train'){mark(0,-12,'#eac98a',7);mark(0,4,'#f7b0a0',5)}if(state.scene==='academy')mark(0,-20,'#eac98a',8);mg.save();mg.translate(cx,cy);mg.rotate(-state.yaw);mg.fillStyle='#fff2ba';mg.beginPath();mg.moveTo(0,-10);mg.lineTo(-7,8);mg.lineTo(7,8);mg.closePath();mg.fill();mg.restore();mg.fillStyle='#fff';mg.font='bold 11px system-ui';mg.fillText('地圖',8,15)}
function draw(t){resize();let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8cb3cb');sky.addColorStop(.62,'#d8c4ac');sky.addColorStop(1,'#6c9a85');g.fillStyle=sky;g.fillRect(0,0,W,H);let hor=H*.61;g.fillStyle=state.scene==='train'?'#b3a38b':'#8ab39d';g.fillRect(0,hor,W,H-hor);for(let i=-14;i<=14;i++){let z=i*3;poly([[-30,0,z],[30,0,z],[30,0,z+.05],[-30,0,z+.05]],'#ffffff18')}for(let i=-10;i<=10;i++){let x=i*3;poly([[x,0,-35],[x+.05,0,-35],[x+.05,0,35],[x,0,35]],'#ffffff13')}makeWorld();let sorted=objects.slice().sort((a,b)=>{let A=project(a.x,0,a.z).b,B=project(b.x,0,b.z).b;return B-A});for(let o of sorted)box(o);if(state.scene==='platform'){character(-2,0,'#497887');character(2,-5,'#b27e64')}if(state.scene==='train'){character(0,4+Math.sin(t*.0005)*3,'#ab6b84');character(-1,-7,'#3f7b79')}if(state.scene==='academy'){character(-3,-3,'#ad6681');character(4,-5,'#537f8b')}character(state.x,state.z,'#564c8e');drawMap()}
let saveClock=0;function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(playing&&!dialog){let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.back?1:0)-(keys.forward?1:0);if(dx||dz){let m=Math.hypot(dx,dz),speed=6.5*dt;state.x+=dx/m*speed;state.z+=dz/m*speed;let lim=state.scene==='train'?3.35:state.scene==='platform'?11:25;state.x=Math.max(-lim,Math.min(lim,state.x));state.z=Math.max(state.scene==='train'?-13:-27,Math.min(state.scene==='train'?13:30,state.z));saveClock+=dt;if(saveClock>.6){save();saveClock=0}}}draw(t);requestAnimationFrame(frame)}update();requestAnimationFrame(frame);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
})();
</script></body></html>
